services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in the deploy .env}
      MYSQL_DATABASE: kairos
      MYSQL_USER: kairos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in the deploy .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukairos", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://kairos:${MYSQL_PASSWORD}@mysql:3306/kairos
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:?set in the deploy .env}
      CORS_ORIGINS: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET:?set in the deploy .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set in the deploy .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      RESEND_API_KEY: ${RESEND_API_KEY:?set in the deploy .env}
      EMAIL_FROM: ${EMAIL_FROM:-Kairos <onboarding@resend.dev>}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_URL: ${APP_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - internal

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:

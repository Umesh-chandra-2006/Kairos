<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairos - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a; color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
    }
    .offline-card { max-width: 400px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { font-size: 15px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
    .icon { font-size: 48px; margin-bottom: 16px; display: block; }
    button {
      background: #6366f1; color: white; border: none; border-radius: 8px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="offline-card">
    <span class="icon">&#128268;</span>
    <h1>You're offline</h1>
    <p>Kairos needs an internet connection to load questions and evaluate your answers. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
